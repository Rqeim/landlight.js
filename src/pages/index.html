<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landlight</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <include src="src/components/header.html"></include>

  <main x-data="{ count: 0 }" class="max-w-6xl mx-auto px-4 py-16 text-center">
    <h1 class="text-4xl font-bold tracking-tight mb-4">Alpine + Vite + Tailwind</h1>
    <p class="text-gray-600 mb-8">Click the button below. Alpine is wired up.</p>
    <button
      @click="count++"
      class="inline-flex items-center gap-2 px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
    >
      Clicks: <span x-text="count" class="font-bold">0</span>
    </button>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
