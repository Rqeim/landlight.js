<header x-data="{ open: false }" class="bg-white border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <img
        src="https://cdn.example.com/images/logo.png"
        alt="Logo"
        class="h-8 w-auto"
        width="32"
        height="32"
      />
      <span class="font-semibold text-lg text-gray-900">Landlight</span>
    </a>

    <button
      @click="open = !open"
      class="md:hidden p-2 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
      aria-label="Toggle menu"
    >
      <svg
        class="w-6 h-6 text-gray-700"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          :class="open ? 'hidden' : 'block'"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
        <path
          :class="open ? 'block' : 'hidden'"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 6l12 12M18 6L6 18"
        />
      </svg>
    </button>

    <nav class="hidden md:flex items-center gap-6">
      <a
        href="/"
        class="text-sm text-gray-600 hover:text-gray-900 transition-colors"
        >Home</a
      >
      <a
        href="/about"
        class="text-sm text-gray-600 hover:text-gray-900 transition-colors"
        >About</a
      >
      <a
        href="/contact"
        class="text-sm text-gray-600 hover:text-gray-900 transition-colors"
        >Contact</a
      >
    </nav>
  </div>

  <nav x-show="open" x-collapse class="md:hidden border-t border-gray-100">
    <div class="px-4 py-3 flex flex-col gap-3">
      <a
        href="/"
        class="text-sm text-gray-600 hover:text-gray-900 transition-colors"
        >Home</a
      >
      <a
        href="/about"
        class="text-sm text-gray-600 hover:text-gray-900 transition-colors"
        >About</a
      >
      <a
        href="/contact"
        class="text-sm text-gray-600 hover:text-gray-900 transition-colors"
        >Contact</a
      >
    </div>
  </nav>
</header>
